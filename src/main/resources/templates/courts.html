<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<script th:inline="javascript">
    function changeFilter() {
        const stadiumIdx = document.getElementById("courtSelect").value;
        const yearMonth = document.getElementById("monthSelect").value;

        const parts = yearMonth.split('-');
        const year = parts[0];
        const month = parts[1];

        location.href = `/court-view/${stadiumIdx}?searchYear=${year}&searchMonth=${month}`;
    }
</script>

<head>
    <meta charset="UTF-8">
    <title>화성시 테니스 코트 예약 현황</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .calendar-day-header {
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            border-radius: 6px;
            color: white;
            background-color: #495057;
        }
        .calendar-cell {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            min-height: 120px;
            padding: 8px;
        }
        /* 이번 달 아닌 날짜 */
        .calendar-cell.other-month {
            background-color: #f8f9fa;
            opacity: 0.5;
        }
        .date-number {
            font-size: 0.95rem;
            font-weight: 700;
            color: #495057;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #f1f3f5;
        }
        .date-number.today {
            color: white;
            background-color: #0d6efd;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .date-number.sunday { color: #dc3545; }
        .date-number.saturday { color: #0d6efd; }
        .time-badge {
            font-size: 0.72rem;
            width: 100%;
            text-align: center;
            margin-bottom: 3px;
            padding: 3px 4px;
            border-radius: 4px;
            font-weight: 600;
            display: block;
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .no-slot {
            font-size: 0.75rem;
            color: #adb5bd;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid px-4 py-4">
    <div class="d-flex align-items-center justify-content-between mb-4 p-4 bg-white rounded shadow-sm">
        <h1 class="h4 mb-0 fw-bold">
            <label for="monthSelect">조회 월 선택:</label>
            <select id="monthSelect" name="searchMonth" onchange="changeFilter()">

                <option th:value="${#temporals.format(today, 'yyyy-MM')}"
                        th:selected="${selectedYearMonth == #temporals.format(today, 'yyyy-MM')}"
                        th:text="${#temporals.format(today, 'yyyy-MM')}">
                    이번달
                </option>

                <option th:if="${today.dayOfMonth >= 27}"
                        th:value="${#temporals.format(today.plusMonths(1), 'yyyy-MM')}"
                        th:selected="${selectedYearMonth == #temporals.format(today.plusMonths(1), 'yyyy-MM')}"
                        th:text="${#temporals.format(today.plusMonths(1), 'yyyy-MM')}">
                    다음달
                </option>
            </select>
            &nbsp;
            <span th:text="${stadiumIdx}">n</span>번 코트 예약 현황
        </h1>

        <div class="d-flex align-items-center gap-2">
            <label class="fw-bold text-muted mb-0 small">🏟️ 코트 선택</label>
            <select id="courtSelect" class="form-select form-select-sm w-auto" onchange="changeFilter()">
                <option value="1" th:selected="${stadiumIdx == '1'}">1번 코트</option>
                <option value="2" th:selected="${stadiumIdx == '2'}">2번 코트</option>
                <option value="3" th:selected="${stadiumIdx == '3'}">3번 코트</option>
                <option value="4" th:selected="${stadiumIdx == '4'}">4번 코트</option>
                <option value="5" th:selected="${stadiumIdx == '5'}">5번 코트</option>
                <option value="6" th:selected="${stadiumIdx == '6'}">6번 코트</option>
                <option value="7" th:selected="${stadiumIdx == '7'}">7번 코트</option>
                <option value="8" th:selected="${stadiumIdx == '8'}">8번 코트</option>
            </select>
        </div>
    </div>

    <div class="card p-4 shadow-sm border-0">
        <div class="calendar-grid mb-2">
            <div class="calendar-day-header" style="background-color:#dc3545;">일</div>
            <div class="calendar-day-header">월</div>
            <div class="calendar-day-header">화</div>
            <div class="calendar-day-header">수</div>
            <div class="calendar-day-header">목</div>
            <div class="calendar-day-header">금</div>
            <div class="calendar-day-header" style="background-color:#0d6efd;">토</div>
        </div>

        <div class="calendar-grid">
            <div th:each="day : ${calendar}"
                 th:with="
                    dayStr=${#temporals.format(day, 'yyyy-MM-dd')},
                    dayNum=${#temporals.format(day, 'd')},
                    isCurrentMonth=${day.monthValue == #temporals.month(currentYearMonth)},
                    isToday=${day.equals(#temporals.createToday())},
                    dayOfWeekValue=${day.dayOfWeek.value}
                 "
                 th:class="'calendar-cell' + (${isCurrentMonth} ? '' : ' other-month')">

                <div th:class="'date-number' + (${isToday} ? ' today' : (${dayOfWeekValue == 7} ? ' sunday' : (${dayOfWeekValue == 6} ? ' saturday' : '')))"
                     th:text="${dayNum}">1</div>

                <div th:if="${isCurrentMonth}">
                    <div th:if="${groupedCourts.containsKey(dayStr)}">
                        <div th:with="slots=${groupedCourts.get(dayStr)}">
                            <span th:each="court : ${slots}"
                                  class="time-badge"
                                  th:text="${court.stadiumBeginHm} + '~' + ${court.stadiumEndHm}">
                            </span>
                        </div>
                    </div>
                    <div th:unless="${groupedCourts.containsKey(dayStr)}" class="no-slot">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
