<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터 수집 검증 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 rounded shadow-sm">
    <h1 class="h4 mb-4 fw-bold">
        📊 경기장 [<span th:text="${stadiumIdx}">0</span>]번 수집 데이터 raw 검증 (총 <span th:text="${courts.size()}">0</span>건)
    </h1>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>코트 날짜 (sorDate)</th>
            <th>시작 시간 (beginHm)</th>
            <th>종료 시간 (endHm)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="court : ${courts}" class="text-center">
            <td th:text="${court.sorDate}" class="fw-bold text-secondary">2026-06-21</td>
            <td th:text="${court.stadiumBeginHm}" class="text-primary">06:00</td>
            <td th:text="${court.stadiumEndHm}">08:00</td>
        </tr>
        <tr th:if="${courts.isEmpty()}">
            <td colspan="6" class="text-center text-muted py-4">수집된 데이터가 DB에 존재하지 않습니다.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
